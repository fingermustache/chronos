name: Go Integration Tests

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  go-integration-tests:
    name: Go Repository Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Run integration tests
        working-directory: src
        # -tags integration unlocks the postgres_test.go files.
        # Testcontainers handles Docker setup automatically on ubuntu-latest.
        run: go test -race -timeout 120s -tags integration ./api-gateway/... ./scheduler/... ./executor/...
