name: Go Unit Tests

on:
  pull_request:
    branches: ["main"]

jobs:
  go-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Run unit tests
        working-directory: src
        run: go test ./pkg/models ./pkg/database
