name: Go Unit Tests

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  go-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Run unit tests
        working-directory: src
        # No -tags integration means postgres_test.go files are skipped.
        # Covers all packages: pkg, middleware, handlers, server integration tests.
        run: go test -race -timeout 30s ./...
